<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأربعون النووية — tasmi3</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <style>
    .adhkar-container { max-width: 600px; margin: 0 auto; padding: 20px 16px 130px; }
    .dhikr-card { background: var(--surface); border: 1px solid var(--gold-dim); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; transition: all 0.2s; }
    .dhikr-card:hover { border-color: var(--gold-line); }
    .dhikr-text { font-size: 1.15rem; line-height: 1.7; font-family: 'Cairo', sans-serif; color: var(--text); margin-bottom: 16px; }
    .dhikr-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--gold-line); padding-top: 12px; }
    .dhikr-info-icon { font-size: 1.4rem; color: var(--text2); cursor: pointer; transition: all 0.2s; user-select:none; -webkit-tap-highlight-color:transparent; }
    .dhikr-info-icon:hover { color: var(--blue2); transform: scale(1.1); }
    .dhikr-info-icon:active { transform: scale(0.92); }
  </style>
</head>
<body>
  <!-- Navigation Sidebar — identical to adhkar.html -->
  <div class="sidebar-overlay" id="navSidebarOverlay" onclick="toggleNavSidebar()"></div>
  <div class="sidebar" id="navSidebar" style="right: auto; left: 0; transform: translateX(-100%);">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--gold-line); padding-bottom:10px; margin-bottom:15px;">
      <h2 style="color:var(--gold); font-family:'Cairo'; margin:0; font-size:1.2rem;">متابعة الحفظ</h2>
      <button class="btn-close-sidebar" onclick="toggleNavSidebar()" style="position:static;">✕</button>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">الرئيسية</a>
      <a href="search.html" class="nav-link">🔍 البحث في القرآن</a>
      <a href="mos7af.html" class="nav-link">📖 المصحف الشريف</a>
      <a href="adhkar.html" class="nav-link" style="color: var(--gold);">الأذكار 📿</a>
      <a href="hadeeth.html" class="nav-link active" style="color: var(--gold); border:1px solid var(--gold); border-radius:8px; background:var(--gold-dim);">الأربعون النووية 📜</a>
      <a href="tasbeeh.html" class="nav-link">السبحة</a>
      <a href="needs_review.html" class="nav-link">يحتاج مراجعة 🔴</a>
      <a href="good.html" class="nav-link">جيد 🟡</a>
      <a href="perfect.html" class="nav-link">ممتاز 🟢</a>
      <button id="btnInstallApp" class="nav-link" style="display:block; text-align:right; border:1px solid var(--gold); background:var(--gold-dim); color:var(--gold); font-weight:bold; cursor:pointer; margin-top:20px; font-size:1rem; border-radius:8px;" onclick="installApp()">📲 تثبيت / تحديث التطبيق</button>
      <div class="nav-toggle-row">
        <span>إشعارات الصلاة على النبي ﷺ</span>
        <input type="checkbox" id="toggleDhikrPopup" onchange="toggleDhikrPopupSetting(this)" checked>
      </div>
    </div>
  </div>

  <header style="flex-direction: row; justify-content: space-between; padding: 12px 20px;">
    <div style="display: flex; align-items: center; gap: 15px;">
      <button class="btn-nav" onclick="window.location.href='index.html'" style="font-size: 1.2rem;">← رجوع</button>
      <h1 style="color: var(--gold); font-family: 'Cairo'; margin: 0; font-size: 1.3rem;">الأربعون النووية 📜</h1>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <div class="theme-toggle" style="margin:0;">
        <button id="btnThemeDark" onclick="setHadeethTheme('dark')">🌙</button>
        <button id="btnThemeLight" onclick="setHadeethTheme('light')">☀️</button>
      </div>
      <button id="btnNav" onclick="toggleNavSidebar()" style="background: var(--gold); border: 1px solid var(--gold); color: var(--bg); padding: 4px 10px; border-radius: 8px; font-family: 'Cairo', sans-serif; cursor: pointer; font-weight: bold; transition: all 0.2s; height: 36px;">☰</button>
    </div>
  </header>

  <div class="adhkar-container">
    <div style="text-align:center; margin-bottom:18px; padding:14px; background:var(--gold-dim); border:1px solid var(--gold-line); border-radius:12px;">
      <div style="font-family:'Scheherazade New',serif; font-size:1.6rem; color:var(--gold); font-weight:700;">الأربعون النووية</div>
      <div style="font-family:'Cairo'; font-size:0.85rem; color:var(--text2); margin-top:4px;">جامع لأصول الدين — <span id="hadeethCount">٤٠ حديثًا</span> — اضغط ❓ لكل حديث لعرض الشرح</div>
    </div>
    <div id="hadeethList"></div>
  </div>

  <!-- Hadeeth Info Modal — identical behavior to adhkar dhikrInfoModal -->
  <div class="custom-modal-overlay" id="hadeethInfoModal" onclick="closeHadeethModal(event)">
    <div class="custom-modal" onclick="event.stopPropagation()">
      <div class="custom-modal-header">
        <h3 class="custom-modal-title">شرح الحديث</h3>
        <button class="custom-modal-close" onclick="closeHadeethModal()">×</button>
      </div>
      <div class="custom-modal-body">
        <p id="hadeethRef" style="color: var(--text2); font-size: 0.9rem; margin-bottom: 14px;"></p>
        <div style="background:var(--gold-dim); border:1px solid var(--gold-line); border-radius:10px; padding:12px; margin-bottom:12px;">
          <div style="color:var(--gold); font-weight:800; font-size:0.95rem; margin-bottom:6px;">📖 الشرح</div>
          <p id="hadeethSharh" style="color: var(--text); font-size: 1rem; line-height: 1.7;"></p>
        </div>
        <div style="background:rgba(74,144,217,0.08); border:1px solid rgba(74,144,217,0.25); border-radius:10px; padding:12px;">
          <div style="color:#7ab8ff; font-weight:800; font-size:0.95rem; margin-bottom:6px;">الشرح بالعاميه</div>
          <p id="hadeethEgyptian" style="color: var(--text); font-size: 0.98rem; line-height: 1.7;"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="hadeeth_data.js"></script>
  <script src="hadeeth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  </script>
</body>
</html>
