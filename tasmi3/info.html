  <script>
    (function () {
      var theme = localStorage.getItem('tasmi3_theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.classList.add('theme-dark-early');

        document.documentElement.classList.add('theme-light-early');

  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .header-compact { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: var(--header-bg); border-bottom: 1px solid var(--gold-line); position: sticky; top: 0; z-index: 100; }
    .page-title { color: var(--gold); font-family: 'Cairo'; font-weight: bold; font-size: 1.3rem; margin: 0; }
    .info-wrap { flex: 1; padding: 24px 16px 60px; max-width: 900px; margin: 0 auto; width: 100%; }
    .info-search { width: 100%; background: var(--custom-search-bg); border: 1px solid var(--gold-line); color: var(--text); padding: 10px 14px; border-radius: 10px; font-family: 'Cairo'; font-size: 0.95rem; outline: none; direction: rtl; margin-bottom: 16px; }
    .info-search:focus { border-color: var(--gold); }
    .info-count { color: var(--text2); font-size: 0.85rem; margin-bottom: 12px; text-align: center; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .info-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--gold-line); border-radius: 12px; padding: 12px 14px; text-decoration: none; color: var(--text); transition: border-color 0.2s, background 0.2s, transform 0.12s; }
    .info-card:hover { border-color: var(--gold); background: var(--gold-dim); }
    .info-card:active { transform: scale(0.98); }
    .info-num { min-width: 38px; height: 38px; border-radius: 10px; background: var(--gold-dim); border: 1px solid var(--gold-line); color: var(--gold); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; }
    .info-names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .info-name { font-weight: 700; font-size: 1rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-meta { font-size: 0.8rem; color: var(--text2); }
    .info-meta b { color: var(--gold); }
    @media (max-width: 480px) {
      .info-wrap { padding: 16px 12px 60px; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="header-compact">
    <h1 class="page-title">ℹ️ فهرس القرآن — Quran Index</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <a href="index.html" style="background: var(--surface); border: 1px solid var(--gold-line); color: var(--text); padding: 4px 10px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; white-space: nowrap;">الرئيسية</a>

      [21,"الأنبياء",112,[17]],[22,"الحج",78,[17]],[23,"المؤمنون",118,[18]],[24,"النور",64,[18]],[25,"الفرقان",77,[18,19]],
      [26,"الشعراء",227,[19]],[27,"النمل",93,[19,20]],[28,"القصص",88,[20]],[29,"العنكبوت",69,[20,21]],[30,"الروم",60,[21]],
      [31,"لقمان",34,[21]],[32,"السجدة",30,[21]],[33,"الأحزاب",73,[21,22]],[34,"سبأ",54,[22]],[35,"فاطر",45,[22]],

      [101,"القارعة",11,[30]],[102,"التكاثر",8,[30]],[103,"العصر",3,[30]],[104,"الهمزة",9,[30]],[105,"الفيل",5,[30]],
      [106,"قريش",4,[30]],[107,"الماعون",7,[30]],[108,"الكوثر",3,[30]],[109,"الكافرون",6,[30]],[110,"النصر",3,[30]],
      [111,"المسد",5,[30]],[112,"الإخلاص",4,[30]],[113,"الفلق",5,[30]],[114,"الناس",6,[30]]
    ];

    function juzLabel(juz) {
      if (juz.length === 1) return 'الجزء ' + juz[0];
      var parts = [];
      for (var i = 0; i < juz.length; i++) parts.push(juz[i]);
      return 'الأجزاء ' + parts.join('، ');
    }

    function renderInfo(filter) {
      var grid = document.getElementById('infoGrid');
      var count = document.getElementById('infoCount');
      grid.innerHTML = '';
      var shown = 0;
      var q = (filter || '').trim();
      for (var i = 0; i < SURAHS_INFO.length; i++) {
        var s = SURAHS_INFO[i];
        var num = s[0], name = s[1], ayahs = s[2], juz = s[3];
        if (q && name.indexOf(q) === -1 && String(num).indexOf(q) === -1) continue;
        shown++;
        var a = document.createElement('a');
        a.className = 'info-card';
        a.href = 'index.html?surah=' + num;
        a.setAttribute('data-surah', String(num));
        var n = document.createElement('div');
        n.className = 'info-num';
        n.textContent = num;
        var wrap = document.createElement('div');
        wrap.className = 'info-names';
        var nm = document.createElement('div');
        nm.className = 'info-name';
        nm.textContent = name;
        var meta = document.createElement('div');
        meta.className = 'info-meta';
        meta.innerHTML = '<b>' + ayahs + '</b> آيات — ' + juzLabel(juz);
        wrap.appendChild(nm);
        wrap.appendChild(meta);
        a.appendChild(n);
        a.appendChild(wrap);
        grid.appendChild(a);
      }
      if (count) count.textContent = 'عدد السور المعروضة: ' + shown + ' / 114';
    }

    function toggleNavSidebar() {
      document.getElementById('navSidebar').classList.toggle('show');
      document.getElementById('navSidebarOverlay').classList.toggle('show');
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderInfo('');
      var inp = document.getElementById('infoSearch');
      if (inp) inp.addEventListener('input', function () { renderInfo(inp.value); });
      var cb = document.getElementById('toggleDhikrPopup');
      try {
        if (cb && typeof isDhikrPopupEnabled === 'function') cb.checked = isDhikrPopupEnabled();
      } catch (e) {}
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        try { navigator.serviceWorker.register('sw.js'); } catch (e) {}
      });
    }
  </script>
