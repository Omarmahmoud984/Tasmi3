<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأذكار — tasmi3</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    /* Specific styles for Adhkar page to keep main css clean */
    .adhkar-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 130px;
    }

    .dhikr-card {
      background: var(--surface);
      border: 1px solid var(--gold-dim);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .dhikr-card.completed {
      background: rgba(42, 107, 79, 0.1);
      /* light green */
      border-color: var(--green2);
    }

    .dhikr-card:hover {
      border-color: var(--gold-line);
    }

    .dhikr-text {
      font-size: 1.15rem;
      /* Zoomed out from 1.3rem */
      line-height: 1.7;
      font-family: 'Cairo', sans-serif;
      color: var(--text);
      margin-bottom: 16px;
    }

    /* Whole card is the tap target — no floating counter circles */
    .dhikr-card:active {
      background: rgba(196, 154, 59, 0.07);
    }

    .dhikr-card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .dhikr-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--gold-line);
      padding-top: 10px;
      margin-top: 2px;
    }

    .dhikr-meter {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }

    .dhikr-bar {
      flex: 1;
      min-width: 40px;
      height: 6px;
      border-radius: 99px;
      background: rgba(128, 128, 128, 0.22);
      overflow: hidden;
    }

    .dhikr-bar-fill {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      transition: width 0.25s ease;
    }

    .dhikr-card.completed .dhikr-bar-fill {
      background: var(--green2);
    }

    .dhikr-pill {
      font-family: 'Cairo', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.8;
      color: var(--gold);
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      border-radius: 10px;
      padding: 1px 9px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .dhikr-pill.done {
      color: #5ecf8a;
      background: rgba(42, 180, 100, 0.14);
      border-color: rgba(42, 180, 100, 0.4);
    }

    .theme-light .dhikr-pill.done {
      color: #177a4a;
      background: rgba(42, 180, 100, 0.12);
      border-color: rgba(23, 122, 74, 0.32);
    }

    .dhikr-pill.pop {
      animation: pillPop 0.18s ease;
    }

    @keyframes pillPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .dhikr-info-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .dhikr-info-icon:hover {
      color: var(--gold);
      background: var(--gold-dim);
      border-color: var(--gold-line);
    }

    .dhikr-expand-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0;
      color: var(--gold);
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.2s, background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .dhikr-expand-btn:hover {
      background: var(--gold-dim);
      border-color: var(--gold-line);
    }

    .dhikr-expand-btn.open {
      transform: rotate(180deg);
    }

    .sub-dhikr-container {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--gold-line);
    }

    .sub-dhikr-container.show {
      display: block;
    }

    .sub-dhikr-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      margin-bottom: 9px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: rgba(128, 128, 128, 0.05);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .sub-dhikr-item:last-child {
      margin-bottom: 0;
    }

    .sub-dhikr-item:hover {
      border-color: var(--gold-line);
    }

    .sub-dhikr-item:active {
      background: var(--gold-dim);
    }

    .sub-dhikr-item:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .sub-dhikr-item.finished {
      opacity: 0.72;
    }

    .sub-dhikr-text {
      font-size: 1.05rem;
      font-family: 'Cairo', sans-serif;
      color: var(--text);
      line-height: 1.7;
    }

    /* ── Share Card (bottom of adhkar list) ── */
    .adhkar-share-card {
      margin-top: 8px;
      padding: 20px 18px;
      border-radius: var(--radius);
      border: 1px dashed var(--gold-line);
      background: transparent;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .adhkar-share-label {
      font-family: 'Cairo', sans-serif;
      font-size: 0.82rem;
      color: var(--text2);
      letter-spacing: 0.5px;
    }

    .adhkar-share-btn,
    .adhkar-download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      color: var(--gold);
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 11px 24px;
      min-height: 44px;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      letter-spacing: 0.3px;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      max-width: 320px;
      margin-inline: auto;
    }

    .adhkar-share-btn:hover,
    .adhkar-download-btn:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
      transform: scale(1.02);
      box-shadow: 0 4px 18px rgba(128, 128, 128, 0.14);
    }

    .adhkar-share-btn:active,
    .adhkar-download-btn:active {
      transform: scale(0.97);
    }

    .adhkar-share-btn:focus-visible,
    .adhkar-download-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .adhkar-share-btn.copied {
      background: rgba(42, 180, 100, 0.15);
      border-color: rgba(42, 180, 100, 0.45);
      color: #5ecf8a;
      transform: scale(1);
      box-shadow: none;
    }

    .theme-light .adhkar-share-btn.copied {
      color: #177a4a;
    }

    .adhkar-download-wrap {
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }

    .adhkar-download-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* Tabs — scroll instead of squeezing on narrow phones */
    .adhkar-container .tabs-header {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .adhkar-container .tabs-header::-webkit-scrollbar {
      display: none;
    }

    .adhkar-container .tab-btn {
      min-width: 84px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Narrow phones: keep the header on one line ── */
    @media (max-width: 480px) {
      .adhkar-header {
        padding: 8px 10px !important;
        gap: 6px;
      }

      .adhkar-header > div {
        gap: 8px !important;
        min-width: 0;
      }

      .adhkar-header .btn-nav {
        font-size: 0.82rem !important;
        padding: 6px 9px !important;
        min-height: 36px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .adhkar-header h1 {
        font-size: 1rem !important;
        white-space: nowrap;
      }

      .adhkar-header .theme-toggle button {
        width: 34px;
        height: 34px;
        font-size: 0.9rem;
        padding: 0;
      }

      .adhkar-header #btnNav {
        width: 38px;
        height: 34px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation Sidebar -->
  <div class="sidebar-overlay" id="navSidebarOverlay" onclick="toggleNavSidebar()"></div>
  <div class="sidebar" id="navSidebar" style="right: auto; left: 0; transform: translateX(-100%);">
    <div
      style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--gold-line); padding-bottom:10px; margin-bottom:15px;">
      <h2 style="color:var(--gold); font-family:'Cairo'; margin:0; font-size:1.2rem;">متابعة الحفظ</h2>
      <button class="btn-close-sidebar" onclick="toggleNavSidebar()" style="position:static;">✕</button>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">الرئيسية</a>
      <a href="bookmark.html" class="nav-link">🔖 العلامات <span class="bm-nav-count" data-bm-count="tasmi3"></span></a>
      <a href="search.html" class="nav-link">🔍 البحث في القرآن</a>
      <a href="info.html" class="nav-link">ℹ️ Info</a>
      <a href="adhkar.html" class="nav-link active" style="color: var(--gold);">الأذكار 📿</a>
      <a href="tasbeeh.html" class="nav-link">السبحة</a>
      <a href="needs_review.html" class="nav-link">يحتاج مراجعة 🔴</a>
      <a href="good.html" class="nav-link">جيد 🟡</a>
      <a href="perfect.html" class="nav-link">ممتاز 🟢</a>

      <button id="btnInstallApp" class="nav-link"
        style="display:block; text-align:right; border:1px solid var(--gold); background:var(--gold-dim); color:var(--gold); font-weight:bold; cursor:pointer; margin-top:20px; font-size:1rem; border-radius:8px;"
        onclick="installApp()">📲 تثبيت / تحديث التطبيق</button>

      <div class="nav-toggle-row">
        <span>إشعارات الصلاة على النبي ﷺ</span>
        <input type="checkbox" id="toggleDhikrPopup" onchange="toggleDhikrPopupSetting(this)" checked>
      </div>
    </div>
  </div>

  <header class="adhkar-header" style="flex-direction: row; justify-content: space-between; padding: 12px 20px;">
    <div style="display: flex; align-items: center; gap: 15px;">
      <button class="btn-nav" onclick="window.location.href='index.html'" style="font-size: 1.2rem;">← رجوع</button>
      <h1 style="color: var(--gold); font-family: 'Cairo'; margin: 0; font-size: 1.3rem;">الأذكار 📿</h1>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <div class="theme-toggle" style="margin:0;">
        <button id="btnThemeDark" onclick="setAdhkarTheme('dark')">🌙</button>
        <button id="btnThemeLight" onclick="setAdhkarTheme('light')">☀️</button>
      </div>
      <button id="btnNav" onclick="toggleNavSidebar()"
        style="background: var(--gold); border: 1px solid var(--gold); color: var(--bg); padding: 4px 10px; border-radius: 8px; font-family: 'Cairo', sans-serif; cursor: pointer; font-weight: bold; transition: all 0.2s; height: 36px;">☰</button>
    </div>
  </header>

  <div class="adhkar-container">
    <div class="tabs-header"
      style="border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; border: 1px solid var(--gold-line);">
      <button class="tab-btn active" onclick="switchAdhkarTab('morning', this)">أذكار الصباح</button>
      <button class="tab-btn" onclick="switchAdhkarTab('evening', this)">أذكار المساء</button>
      <button class="tab-btn" onclick="switchAdhkarTab('after_prayer', this)">بعد الصلاة</button>
      <button class="tab-btn" onclick="switchAdhkarTab('sleep', this)">أذكار النوم</button>
    </div>

    <div id="adhkarList">
      <!-- List will be populated by JS -->
    </div>
  </div>

  <!-- Dhikr Info Modal -->
  <div class="custom-modal-overlay" id="dhikrInfoModal" onclick="closeDhikrModal(event)">
    <div class="custom-modal" onclick="event.stopPropagation()">
      <div class="custom-modal-header">
        <h3 class="custom-modal-title">فضل الذكر</h3>
        <button class="custom-modal-close" onclick="closeDhikrModal()">×</button>
      </div>
      <div class="custom-modal-body">
        <p id="dhikrRef" style="color: var(--text2); font-size: 0.95rem; margin-bottom: 10px;"></p>
        <p id="dhikrFadhilah" style="color: var(--gold); font-size: 1.1rem; line-height: 1.6; font-weight: bold;"></p>
      </div>
    </div>
  </div>

  <script src="adhkar_data.js"></script>
  <script src="adhkar.js"></script>
  <script>
    // ── 1. Auto-update URL on tab switch ──
    const _origSwitch = switchAdhkarTab;
    switchAdhkarTab = function (category, btn) {
      _origSwitch(category, btn);
      history.replaceState(null, '', `adhkar.html?section=${category}`);
    };

    // ── 2. Inject share card after every list render ──
    const _origRender = renderList;
    renderList = function (category) {
      _origRender(category);
      const list = document.getElementById('adhkarList');

      // ── Download button (top) ──
      const dlWrap = document.createElement('div');
      dlWrap.className = 'adhkar-download-wrap';
      dlWrap.innerHTML = `
        <button class="adhkar-download-btn" id="btnDownloadImg"
          onclick="exportSectionImage('${category}')">
          📥 تحميل الصورة
        </button>`;
      list.insertBefore(dlWrap, list.firstChild);

      // ── Share card (bottom) ──
      const card = document.createElement('div');
      card.className = 'adhkar-share-card';
      card.innerHTML = `
        <span class="adhkar-share-label">شارك هذا القسم مع أحبابك</span>
        <button class="adhkar-share-btn" id="btnAdhkarShare" onclick="shareAdhkar()">
          <span>🔗</span><span>نسخ رابط القسم</span>
        </button>
      `;
      list.appendChild(card);
    };

    // Re-render immediately so the initial view also gets the download button
    renderList(currentCategory);

    // ── 3. Share function ──
    function shareAdhkar() {
      const section = currentCategory || 'morning';
      const url = `${window.location.origin}${window.location.pathname}?section=${section}`;
      const btn = document.getElementById('btnAdhkarShare');

      navigator.clipboard.writeText(url).then(() => {
        btn.innerHTML = '<span>✓</span><span>تم النسخ</span>';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerHTML = '<span>🔗</span><span>نسخ رابط القسم</span>';
          btn.classList.remove('copied');
        }, 2200);
      }).catch(() => {
        prompt('انسخ الرابط:', url);
      });

      if (navigator.share) {
        navigator.share({ title: 'الأذكار', text: 'أذكار ' + section, url: url }).catch(() => { });
      }
    }

    // ── 4. Deep-link: restore section from ?section= URL param ──
    (function () {
      const VALID = ['morning', 'evening', 'after_prayer', 'sleep'];
      const section = new URLSearchParams(window.location.search).get('section');
      if (section && VALID.includes(section)) {
        const tabBtns = document.querySelectorAll('.tabs-header .tab-btn');
        const idx = VALID.indexOf(section);
        if (tabBtns[idx]) switchAdhkarTab(section, tabBtns[idx]);
      }
    })();
  </script>
  <script src="bookmarks.js"></script>
</body>

</html>
